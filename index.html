<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pathway Navigator · Your future, mapped. Starting at MDC.</title>
<meta name="description" content="Pick a career, get your step-by-step plan starting at Miami Dade College. Free, no sign-up, works on your phone.">
<meta property="og:title" content="Pathway Navigator · Your future, mapped.">
<meta property="og:description" content="Pick a career. Get your semester-by-semester plan, starting at Miami Dade College. Free, 2-minute quiz.">
<meta property="og:image" content="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=1200&h=630&q=70">
<meta name="theme-color" content="#0B2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--blue:#0B5FA5;--blue-50:#EAF2FB;--orange:#F4A259;--ink:#0F172A;--muted:#475569;--line:#E2E8F0;--bg:#F5F7FA;--ok:#0F7B4C}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.5}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;letter-spacing:-0.01em;margin:0}
a{color:var(--blue)}a:hover{color:#08467A}
button{font:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
header.top{background:var(--navy);color:#fff}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;padding-bottom:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.brand:hover{color:#fff}
.brand b{font-family:'Space Grotesk',sans-serif;font-size:20px}
.brand small{display:block;color:#C9D6E8;font-size:12px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap}
nav.tabs a{color:#fff;text-decoration:none;padding:9px 14px;border-radius:10px;font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:rgba(255,255,255,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:2px solid var(--blue);background:var(--blue);color:#fff;font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{background:#08467A;border-color:#08467A;color:#fff}
.btn.ghost{background:#fff;color:var(--blue)}
.btn.ghost:hover{background:var(--blue-50);color:var(--blue)}
.btn.warm{background:var(--orange);border-color:var(--orange);color:var(--navy)}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.hero{background:var(--navy);color:#fff;padding:48px 0 56px}
.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.08;max-width:820px}
.hero p{color:#C9D6E8;font-size:18px;max-width:640px;margin:16px 0 24px}
.hero .actions{display:flex;gap:12px;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.career{display:flex;flex-direction:column;gap:10px;text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;padding:20px;color:var(--ink);text-decoration:none;transition:border-color .15s,transform .15s}
.career:hover{border-color:var(--blue);transform:translateY(-2px);color:var(--ink)}
.career .icon{width:48px;height:48px;border-radius:12px;background:var(--blue-50);color:var(--blue);display:flex;align-items:center;justify-content:center}
.career h3{font-size:20px}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--blue-50);color:var(--blue)}
section.block{padding:36px 0}
.how{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.how .n{width:34px;height:34px;border-radius:999px;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:700;margin-bottom:8px}
/* quiz */
.quiz{max-width:720px;margin:36px auto}
.progress{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.progress>div{height:100%;background:var(--blue);border-radius:999px;transition:width .25s}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{text-align:left;min-height:52px;padding:12px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:16px;color:var(--ink)}
.opt:hover{border-color:var(--blue);background:var(--blue-50)}
/* roadmap */
.layout{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;padding:28px 0 56px}
.side{flex:1 1 280px;max-width:360px;display:flex;flex-direction:column;gap:16px}
.main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
select,input[type=number]{min-height:44px;border-radius:10px;border:2px solid #CBD5E1;padding:0 12px;font:inherit;background:#fff;color:var(--ink)}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:44px;border-radius:10px;border:2px solid #CBD5E1;background:#fff;font-weight:600;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--blue-50);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-family:'Space Grotesk',sans-serif;font-size:22px;color:var(--blue)}
.stat span{font-size:13px;color:var(--muted)}
.next{display:flex;gap:12px;align-items:flex-start;background:#FFF4E8;border:1px solid #F6C99A;border-radius:12px;padding:14px}
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
ol.steps li{display:flex;gap:14px}
.rail{display:flex;flex-direction:column;align-items:center;width:40px;flex:none}
.dot{width:40px;height:40px;border-radius:999px;border:2px solid var(--blue);background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:700}
.done .dot{background:var(--blue);color:#fff}
.rail .ln{flex:1;width:2px;background:#CBD5E1;margin-top:6px}
.step{flex:1;min-width:0;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}
.done .step{background:#F8FAFC}
.done .step h3{text-decoration:line-through;text-decoration-color:#94A3B8}
.step .body{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:6px}
.step h3{font-family:Inter,sans-serif;font-size:16px;font-weight:700}
.step .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}
.tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--blue-50);color:var(--blue)}
.tag.par{background:#EEF7F1;color:var(--ok)}
.check{min-height:44px;padding:0 14px;border-radius:10px;border:2px solid #CBD5E1;background:#fff;font-weight:600;color:var(--ink);white-space:nowrap}
.done .check{background:var(--blue);border-color:var(--blue);color:#fff}
.tasks{margin:4px 0 0;padding-left:18px;font-size:14px;color:#334155}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.recos{display:grid;gap:12px;margin-top:16px}
.dialog{position:fixed;inset:0;background:rgba(15,23,42,.5);display:none;align-items:center;justify-content:center;padding:20px}
.dialog.open{display:flex}
.dialog .card{max-width:560px;width:100%}
textarea{width:100%;min-height:220px;border-radius:10px;border:2px solid #CBD5E1;padding:10px;font:13px/1.5 ui-monospace,monospace}
footer{padding:24px 0 40px;font-size:13px;color:var(--muted)}
.hide{display:none!important}
/* marketing */
.hero2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:36px;align-items:center}
.hero-photo{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(135deg,#13396B,#0B5FA5);box-shadow:0 24px 60px rgba(0,0,0,.35)}
.hero-photo img{width:100%;height:100%;object-fit:cover;display:block}
.float{position:absolute;left:16px;bottom:16px;background:#fff;color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:80%}
.float b{display:block;font-size:15px}
.float .chk{width:32px;height:32px;border-radius:999px;background:var(--ok);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.badges span{font-size:13px;font-weight:600;color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:6px 12px}
.hl{color:var(--orange)}
.career.photo{padding:0;overflow:hidden;gap:0}
.career .ph{position:relative;aspect-ratio:16/10;background:linear-gradient(135deg,#13396B,#0B5FA5)}
.career .ph img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.career.photo:hover .ph img{transform:scale(1.05)}
.career .ph .icon{position:absolute;left:14px;bottom:-22px;background:#fff;box-shadow:0 6px 16px rgba(15,23,42,.18)}
.career .txt{padding:30px 20px 20px;display:flex;flex-direction:column;gap:8px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:32px;align-items:center}
.split .pic{border-radius:22px;overflow:hidden;aspect-ratio:5/4;background:linear-gradient(135deg,#13396B,#0B5FA5)}
.split .pic img{width:100%;height:100%;object-fit:cover;display:block}
.perks{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:14px}
.perks li{display:flex;gap:12px;align-items:flex-start}
.perks .pi{width:36px;height:36px;border-radius:10px;background:#FFF4E8;color:#B4530A;display:flex;align-items:center;justify-content:center;flex:none}
.band{position:relative;border-radius:24px;overflow:hidden;min-height:320px;display:flex;align-items:flex-end;background:#0B2545}
.band img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.band::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(11,37,69,.92) 15%,rgba(11,37,69,.25) 70%)}
.band .in{position:relative;z-index:1;padding:32px;color:#fff;display:flex;flex-direction:column;gap:12px;max-width:640px}
.cover{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:21/7;background:linear-gradient(135deg,#13396B,#0B5FA5)}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.credit{font-size:12px;color:var(--muted)}
@media (max-width:600px){.hero{padding:32px 0 40px}.side{max-width:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#home" aria-label="Pathway Navigator home">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F4A259" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg>
      <span><b>Pathway Navigator</b><small>Start at Miami Dade College</small></span>
    </a>
    <nav class="tabs" aria-label="Main">
      <a href="#home" data-nav="home">Explore</a>
      <a href="#quiz" data-nav="quiz">Interest quiz</a>
      <a href="#my-plan" data-nav="plan">My roadmap</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<div class="dialog" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle">
  <div class="card">
    <h2 id="dlgTitle" style="font-size:22px;margin-bottom:8px">Your roadmap as text</h2>
    <p class="muted" style="margin:0 0 10px">Copy it into an email to your advisor, your notes app or a document.</p>
    <label for="dlgText" class="hide">Roadmap text</label>
    <textarea id="dlgText" readonly></textarea>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" id="dlgClose">Close</button>
      <button class="btn" id="dlgCopy">Copy text</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

var TERMS = ['Spring','Fall'];

/* ---------- State ---------- */
var KEY = 'mdc-pathway-v1';
var S = {career:null,pace:'ft',credits:0,startYear:2027,startTerm:'Fall',done:{},quiz:null};
try{var saved=JSON.parse(localStorage.getItem(KEY)||'null');if(saved)Object.assign(S,saved);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

/* ---------- Helpers ---------- */
var app=document.getElementById('app');
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove('show');},1800);}
function termAdd(term,year,n){var i=TERMS.indexOf(term)+n;return {term:TERMS[((i%2)+2)%2],year:year+Math.floor(i/2)};}
function termStr(t){return t.term+' '+t.year;}
function semsLabel(n){if(n<=0)return 'A few weeks';var y=n/2;return n+' semesters (~'+(y%1?y.toFixed(1):y)+' yr'+(y>1?'s':'')+')';}

function plan(c){
  var cur={term:S.startTerm,year:S.startYear},total=0,out=[];
  c.steps.forEach(function(s,i){
    var n=0,when='',time='';
    if(s.kind==='mdc'){var rem=Math.max(0,60-S.credits);n=Math.ceil(rem/(S.pace==='ft'?15:9));time=n?semsLabel(n)+' · '+rem+' credits left':'Already complete';}
    else if(s.kind==='sem'){n=s.sem[S.pace];time=semsLabel(n);}
    else if(s.kind==='par'){time='Alongside your studies';}
    else {time=s.dur;}
    if(s.kind==='mdc'||s.kind==='sem'){
      if(n>0){var end=termAdd(cur.term,cur.year,n-1);when=termStr(cur)+' – '+termStr(end);cur=termAdd(cur.term,cur.year,n);}
      else when='Before '+termStr(cur);
      total+=n;
    } else if(s.kind==='post'){when='From '+termStr(cur);}
    out.push({s:s,i:i,time:time,when:when});
  });
  return {steps:out,total:total,finish:termAdd(cur.term,cur.year,-1)};
}

   '<p class="eyebrow">Question '+(qi+1)+' of '+QUIZ.length+'</p>'+

   (qi>0?'<button class="btn ghost" style="margin-top:16px" id="qBack">Back</button>':'')+

function planText(c,p){
  var dm=S.done[c.id]||{},L=[];
  L.push('MY ROADMAP: '+c.name.toUpperCase());
  L.push('Start: '+S.startTerm+' '+S.startYear+' · '+(S.pace==='ft'?'Full-time':'Part-time')+' · '+S.credits+' credits already earned');
  L.push('School finished: '+termStr(p.finish)+' (~'+(p.total/2)+' yrs)');L.push('');
  p.steps.forEach(function(x,k){L.push((dm[x.i]?'[x] ':'[ ] ')+(k+1)+'. '+x.s.title);L.push('    '+x.s.phase+' · '+x.time+(x.when?' · '+x.when:'')+' · '+x.s.where);});
  L.push('');L.push('Made with Pathway Navigator. Confirm details with an MDC advisor.');
  return L.join('\n');
}
var dlg=document.getElementById('dlg'),lastFocus=null;
function openText(c,p){lastFocus=document.activeElement;document.getElementById('dlgText').value=planText(c,p);dlg.classList.add('open');document.getElementById('dlgCopy').focus();}
function closeDlg(){dlg.classList.remove('open');if(lastFocus)lastFocus.focus();}
document.getElementById('dlgClose').onclick=closeDlg;
dlg.addEventListener('click',function(e){if(e.target===dlg)closeDlg();});
dlg.addEventListener('keydown',function(e){if(e.key==='Escape')closeDlg();});
document.getElementById('dlgCopy').onclick=function(){var t=document.getElementById('dlgText');copy(t.value,'Roadmap copied',t);};
function copy(text,msg,ta){
  try{navigator.clipboard.writeText(text).then(function(){toast(msg);},function(){fallback();});}catch(e){fallback();}
  function fallback(){if(ta){ta.select();toast('Selected — press Ctrl/Cmd+C');}else toast(text);}
}

function footer(){return '<footer><div class="wrap">Pathway Navigator · a Miami Dade College student concept. Program names and timelines are planning estimates; always confirm with an advisor.<div class="credit" style="margin-top:6px">Photos from <a href="https://unsplash.com/" target="_blank" rel="noopener">Unsplash</a>.</div></div></footer>';}

/* ---------- Router ---------- */
function route(){
  var h=(location.hash||'').slice(1);
  if(BY[h])viewPlan(h);
  else if(h==='quiz'){qi=0;qs={};viewQuiz();}
  else if(h==='my-plan'){if(S.career)viewPlan(S.career);else{viewHome();toast('Pick a career first');}}
  else{viewHome();if(h==='careers'){var el=document.getElementById('careers');if(el)el.scrollIntoView();return;}}
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
route();
})();
